name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install mercurial==7.2.4
      - uses: taiki-e/install-action@v2
        with:
          tool: jj@0.45.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - if: runner.os != 'Windows'
        run: python scripts/pty-smoke.py
        env:
          ATELIER_VIEW_TEST: compact

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --os '*' --cpu '*' --frozen-lockfile
      - run: bun run build:release
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: rebase-editor-ci
          path: |
            release/packages.json
            release/tarballs/*.tgz
          if-no-files-found: error
          compression-level: 0

  package-smoke:
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: rebase-editor-ci
      - run: npm run smoke:npm
        env:
          NPM_PTY_SMOKE: '1'
